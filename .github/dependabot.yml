version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /protocols/awg
      - /protocols/awg-legacy
      - /protocols/xray
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
