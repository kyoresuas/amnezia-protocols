version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Базовые образы AmneziaWG закреплены на latest, обновлять нечего.
  # У Xray свой Dockerfile с закрепленной версией Alpine
  - package-ecosystem: docker
    directory: /protocols/xray
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
