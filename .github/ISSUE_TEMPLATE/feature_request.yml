name: Feature request
description: Suggest a protocol, flag, or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are solving. Requests that keep the scripts compatible with the Amnezia client are preferred.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the flags, defaults, or behavior you expect.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AmneziaWG 3.1
        - AmneziaWG 1.5
        - Xray
        - New protocol
        - Installer and CLI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same request.
          required: true
