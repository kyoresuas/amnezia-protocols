name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax check
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -name '*.sh')

      - name: ShellCheck
        run: shellcheck install.sh protocols/*/*.sh

  bootstrap:
    name: One-command install
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the installer from a pipe
        env:
          AMNEZIA_PROTOCOLS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cat install.sh | bash -s -- help | tee help.txt
          grep -q "Загрузка kyoresuas/amnezia-protocols" help.txt
          grep -q "AmneziaWG 3.1" help.txt

  smoke:
    name: Install ${{ matrix.protocol }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: awg
            args: --port 55424 --subnet 10.9.0.0
          - protocol: awg-legacy
            args: --port 55425 --subnet 10.9.1.0
          - protocol: xray
            args: --port 8443

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protocol
        run: ./install.sh ${{ matrix.protocol }} --name protocol-ci ${{ matrix.args }}

      - name: Verify AmneziaWG 3.1
        if: matrix.protocol == 'awg'
        run: |
          docker exec protocol-ci awg show awg0 | tee awg-show.txt
          grep -q "header protection key:" awg-show.txt
          grep -q "content padding addition:" awg-show.txt
          grep -q "random trailers: on" awg-show.txt
          grep -q "disable cookies: on" awg-show.txt

      - name: Verify AmneziaWG 1.5
        if: matrix.protocol == 'awg-legacy'
        run: |
          docker exec protocol-ci wg show wg0 | tee wg-show.txt
          grep -q "listening port: 55425" wg-show.txt
          grep -q "jc:" wg-show.txt

      - name: Verify Xray
        if: matrix.protocol == 'xray'
        run: |
          docker exec protocol-ci sh -lc 'test -s /opt/amnezia/xray/xray_public.key'
          docker exec protocol-ci sh -lc 'test -s /opt/amnezia/xray/server.json'
          docker exec protocol-ci sh -lc 'pgrep xray >/dev/null'

      - name: Remove container
        if: always()
        run: docker rm -f protocol-ci || true
